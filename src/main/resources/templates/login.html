<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log på – Erhvervsakademi København</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">

        <!-- Logo -->
        <a href="/" class="login-logo" aria-label="Erhvervsakademi København - gå til forside">
            <img src="/images/ek.jpg" alt="EK logo" width="60" height="60">
        </a>

        <h1 class="login-heading">Log på</h1>
        <p class="login-subheading">Log på med din mailadresse</p>

        <form class="login-form" th:action="@{/login}" method="post">

            <div class="login-field">
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Mailadresse"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="login-field">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Adgangskode"
                    autocomplete="current-password"
                    required
                >
            </div>

            <p th:if="${errorMessage}" th:text="${errorMessage}" class="error-message"></p>
            <p th:if="${successMessage}" th:text="${successMessage}" class="success-message"></p>

            <button type="submit" class="login-btn">Log på</button>

            <p class="login-switch">Har du ikke en bruger? <a th:href="@{/create-user}">Opret bruger her</a></p>

        </form>

    </div>
</div>

</body>
</html>
