<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Opret bruger – Erhvervsakademi København</title>
    <link rel="stylesheet" href="/css/login.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">

        <!-- Logo -->
        <a href="/" class="login-logo" aria-label="Erhvervsakademi København - gå til forside">
            <img src="/images/ek.jpg" alt="EK logo" width="60" height="60">
        </a>

        <h1 class="login-heading">Opret bruger</h1>
        <p class="login-subheading">Udfyld oplysningerne nedenfor</p>

        <form class="login-form" th:action="@{/create-user}" method="post">

            <div class="login-field">
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Mailadresse"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="login-field">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Adgangskode"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="login-field">
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Bekræft adgangskode"
                    autocomplete="new-password"
                    required
                >
            </div>

            <p th:if="${errorMessage}" th:text="${errorMessage}" class="error-message"></p>
            <p th:if="${successMessage}" th:text="${successMessage}" class="success-message"></p>

            <button type="submit" class="login-btn">Opret bruger</button>

            <p class="login-switch">Har du allerede en bruger? <a th:href="@{/login-page}">Log på her</a></p>

        </form>

    </div>
</div>
<script src="/js/konami.js"></script>
</body>
</html>
